# ------------------------------------------------------------
#  CONEXIÓN CON EL BACKEND
# ------------------------------------------------------------
api.base.url=http://localhost:8080/api

# Otra máquina en red (descomenta y ajusta):
# api.base.url=http://192.168.1.50:8080/api


# ------------------------------------------------------------
#  TIMEOUTS
# ------------------------------------------------------------
api.timeout.connect=10
api.timeout.read=15


# ------------------------------------------------------------
#  AUTH
# ------------------------------------------------------------
api.endpoint.auth.login=/auth/login
api.endpoint.auth.me=/auth/me
api.endpoint.auth.logout=/auth/logout


# ------------------------------------------------------------
#  BALANCE  (solo ADMIN)
# ------------------------------------------------------------
api.endpoint.balance.daily=/balance/daily
api.endpoint.balance.reset=/balance/reset


# ------------------------------------------------------------
#  CATEGORIES  (solo ADMIN)
# ------------------------------------------------------------
api.endpoint.categories=/categories
api.endpoint.categories.search=/categories/search


# ------------------------------------------------------------
#  PRODUCTS
# ------------------------------------------------------------
api.endpoint.products=/products
api.endpoint.products.search=/products/search
api.endpoint.products.active=/products/active
api.endpoint.products.inactive=/products/inactive
api.endpoint.products.price.range=/products/price-range
api.endpoint.products.by.category=/products/category


# ------------------------------------------------------------
#  TABLES
# ------------------------------------------------------------
api.endpoint.tables=/tables


# ------------------------------------------------------------
#  TICKETS
# ------------------------------------------------------------
api.endpoint.tickets=/tickets


# ------------------------------------------------------------
#  USERS  (solo ADMIN)
# ------------------------------------------------------------
api.endpoint.users=/users


# ------------------------------------------------------------
#  UI
# ------------------------------------------------------------
app.window.title=GestoBar
app.window.width=1280
app.window.height=800
app.window.maximized=false
app.ui.refresh.interval=30


# ------------------------------------------------------------
#  ENTORNO
# ------------------------------------------------------------
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
app.env=dev

